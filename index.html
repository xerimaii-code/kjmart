<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="supported-refresh-rates" content="60, 90, 120, 144">
    <title>KJ Mart</title>
    <link rel="manifest" href="/metadata.json">
    <meta name="theme-color" content="#f8fafc">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon512.png">
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KJ Mart">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            /* Updated Theme: Slate & Indigo */
            --background-start-rgb: 241 245 249; /* slate-100 */
            --background-end-rgb: 226 232 240; /* slate-200 */
            --surface-primary-rgb: 255 255 255; /* white */
            --surface-secondary-rgb: 248 250 252; /* slate-50 */
            
            /* Primary: Indigo */
            --primary-rgb: 79 70 229; /* indigo-600 #4f46e5 */
            --primary-dark-rgb: 67 56 202; /* indigo-700 */
            --primary-light-rgb: 224 231 255; /* indigo-100 */
            
            /* Text: Slate */
            --text-primary-rgb: 15 23 42; /* slate-900 */
            --text-secondary-rgb: 100 116 139; /* slate-500 */
            
            --border-color-rgb: 226 232 240; /* slate-200 */
            --shadow-color-rgb: 148 163 184; /* slate-400 */
            
            --danger-rgb: 225 29 72; /* rose-600 */
            --success-rgb: 16 185 129; /* emerald-500 */
            
            --header-height: calc(3.5rem + env(safe-area-inset-top));
        }

        html, body, #root {
            height: 100%;
            overflow: hidden;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        body {
            background-color: rgb(var(--surface-secondary-rgb));
        }

        input, textarea, [contenteditable="true"] {
            -webkit-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }

        /* Modern Scrollbar - Thinner & Cleaner */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.4); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.6); }

        .fixed-filter { flex-shrink: 0; }
        .scrollable-content { 
            flex-grow: 1; 
            overflow-y: auto; 
            scrollbar-gutter: stable;
        }

        /* Style for Window Controls Overlay & iOS Safe Area */
        #app-header {
            -webkit-app-region: drag;
            padding-top: env(safe-area-inset-top);
            height: var(--header-height);
        }
        #app-header button, #app-header a, #app-header input, #app-header select {
            -webkit-app-region: no-drag;
        }
        
        /* Custom animations */
        @keyframes fadeInDown {
          from { opacity: 0; transform: translateY(-12px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-down {
          animation: fadeInDown 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
          will-change: transform, opacity;
        }
        @keyframes fadeInUp {
          from { opacity: 0; transform: translateY(12px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            will-change: transform, opacity;
        }
        @keyframes cardEnter {
          from { opacity: 0; transform: scale(0.97) translateY(8px); }
          to { opacity: 1; transform: scale(1) translateY(0px); }
        }
        .animate-card-enter {
            animation: cardEnter 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            will-change: transform, opacity;
        }

        .text-shadow { text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4); }

        /* Scanner Viewfinder Styles */
        .scanner-guide-hole {
            height: 75px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
            border-radius: 1.25rem;
            border: 3px solid rgba(255, 255, 255, 0.8);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .scanner-guide-hole.scanning {
            border-color: #ef4444; /* red-500 */
        }
        .scanner-guide-hole.success {
            border-color: #22c55e; /* green-500 */
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5), 0 0 25px #22c55e;
        }
        .scanner-guide-hole.idle {
            border-color: rgba(255, 255, 255, 0.4);
            border-style: dashed;
        }
        
        .safe-area-pb {
            padding-bottom: calc(1rem + env(safe-area-inset-bottom));
        }

        /* Active feedback */
        .active-scale:active {
            transform: scale(0.98);
        }
    </style>

    <script>
      // 1. PWA 앱 설치 프롬프트(beforeinstallprompt) 조기 캡처 (상단 헤더의 [앱 설치] 버튼에서 즉시 실행 가능하도록 보관)
      window.__deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('kjmart-install-available'));
      });
      window.addEventListener('appinstalled', function() {
        window.__deferredInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('kjmart-app-installed'));
      });

      // 2. 전체화면 처리:
      // - [앱 설치(WebAPK)]로 실행된 경우(standalone): 시작부터 주소줄이 완전히 없으며 안드로이드 하단 종료 팁도 뜨지 않으므로 별도 requestFullscreen 불필요
      // - [바로가기 만들기] 또는 일반 브라우저 탭으로 실행된 경우: 우측 상단 버튼을 일일이 누르지 않아도 첫 터치 및 백그라운드 복귀 후 터치 시 자동으로 전체화면 전환
      (function() {
        window.__userExitedFullscreen = false;

        function isStandaloneMode() {
          return window.matchMedia('(display-mode: standalone)').matches ||
                 window.matchMedia('(display-mode: fullscreen)').matches ||
                 window.navigator.standalone === true;
        }

        function tryAutoFullscreen() {
          if (isStandaloneMode() || window.__userExitedFullscreen) return;
          var docEl = document.documentElement;
          var isFs = document.fullscreenElement || document.webkitFullscreenElement;
          if (!isFs) {
            var req = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
            if (req) {
              try {
                var p = req.call(docEl, { navigationUI: 'hide' });
                if (p && p.catch) p.catch(function() {});
              } catch (e) {}
            }
          }
        }

        // 일반 탭/바로가기 모드일 때 첫 터치 시 자동 전체화면 진입 (백그라운드 복귀 후에도 자동 재진입)
        document.addEventListener('touchend', tryAutoFullscreen, { passive: true });
        document.addEventListener('click', tryAutoFullscreen, { passive: true });
        document.addEventListener('visibilitychange', function() {
          if (document.visibilityState === 'visible') {
            window.__userExitedFullscreen = false;
          }
        });
      })();
    </script>
    
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>

}
